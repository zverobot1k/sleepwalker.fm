services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sleepwalker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sleepwalker"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://postgres:postgres@db:5432/sleepwalker?sslmode=disable"
      SERVER_ADDR: ":8080"
      FRONTEND_URL: "http://localhost:3000"
      SPOTIFY_SCOPES: "user-read-email user-read-private user-top-read user-read-recently-played user-library-read user-follow-read playlist-read-private"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
