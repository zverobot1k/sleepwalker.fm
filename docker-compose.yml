services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sleepwalker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sleepwalker"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Only Docker-specific overrides; OAuth URLs must come from .env (no localhost defaults).
      DATABASE_URL: "postgres://postgres:postgres@db:5432/sleepwalker?sslmode=disable"
      REDIS_URL: "redis:6379"
      SERVER_ADDR: ":8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./sleepwalker.fm.front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${BASE_URL}
        API_INTERNAL_URL: "http://backend:8080"
    env_file:
      - .env
    environment:
      # Runtime API URL for browser (must be public ngrok URL, not backend:8080).
      API_URL: ${BASE_URL}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
